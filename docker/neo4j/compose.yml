services:
  neo4j:
    image: neo4j:5.26-community
    container_name: dataman-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:?set NEO4J_AUTH in docker/neo4j/.env}
      NEO4J_dbms_default__database: ${NEO4J_DATABASE:-neo4j}
    ports:
      - "${NEO4J_HOST:-127.0.0.1}:${NEO4J_BOLT_PORT:-7670}:7687"
      - "${NEO4J_HOST:-127.0.0.1}:${NEO4J_HTTP_PORT:-7470}:7474"
    volumes:
      - dataman_neo4j_data:/data
      - dataman_neo4j_logs:/logs
      - dataman_neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  dataman_neo4j_data:
  dataman_neo4j_logs:
  dataman_neo4j_plugins:
