[system]
language = "${env:DBGPT_LANG:-zh}"
api_keys = []
encrypt_key = "${env:DBGPT_ENCRYPT_KEY:-change-me-before-production}"

[service.web]
host = "0.0.0.0"
port = 7771

[service.web.database]
type = "sqlite"
path = "pilot/meta_data/dataman.db"

[rag.storage]
[rag.storage.vector]
type = "chroma"
persist_path = "pilot/data"

# LLM, embedding, and reranker configurations are managed in dbgpt_serve_model.
# The worker manager restores enabled model entries from the database at startup.
# Keep provider credentials and endpoints in that database configuration instead
# of duplicating them here as environment-variable-backed model deployments.
