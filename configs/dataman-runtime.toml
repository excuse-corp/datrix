[system]
language = "${env:DBGPT_LANG:-zh}"
api_keys = []
encrypt_key = "${env:DBGPT_ENCRYPT_KEY:-change-me-before-production}"

[service.web]
host = "0.0.0.0"
port = 7771

[service.web.database]
type = "sqlite"
path = "pilot/meta_data/dataman.db"

[rag.storage]
[rag.storage.vector]
type = "chroma"
persist_path = "pilot/data"

[models]
[[models.llms]]
name = "${env:LLM_MODEL_NAME:-Qwen/Qwen2.5-Coder-32B-Instruct}"
provider = "${env:LLM_MODEL_PROVIDER:-proxy/siliconflow}"
api_key = "${env:SILICONFLOW_API_KEY}"

[[models.embeddings]]
name = "${env:EMBEDDING_MODEL_NAME:-BAAI/bge-large-zh-v1.5}"
provider = "${env:EMBEDDING_MODEL_PROVIDER:-proxy/openai}"
api_url = "${env:EMBEDDING_MODEL_API_URL:-https://api.siliconflow.cn/v1/embeddings}"
api_key = "${env:SILICONFLOW_API_KEY}"

[[models.rerankers]]
name = "BAAI/bge-reranker-v2-m3"
provider = "proxy/siliconflow"
api_key = "${env:SILICONFLOW_API_KEY}"
